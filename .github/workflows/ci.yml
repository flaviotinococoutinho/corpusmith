name: ci
on: [push, pull_request]

# Menor privilégio explícito: todos os jobs deste workflow apenas leem o
# repositório. A release declara `contents: write` isoladamente no próprio job.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: git config --global user.email ci@corpusmith && git config --global user.name CI
      - run: pip install -e "backend[dev]"
      - run: python -m pytest backend/tests -q
  # PR-0: o resto do gate do AGENTS.md §2 — antes daqui `epistemics lint` e
  # `doctor` eram normativos e nunca executados (docs/15 §2, G-1/G-3).
  # Tudo sobre HOME sintético e determinístico: sem rede, sem modelo local.
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: git config --global user.email ci@corpusmith && git config --global user.name CI
      - run: pip install -e "backend[dev]"
      - name: contratos epistêmicos (INV-EPI-001)
        run: cd backend && python -m corpusmith.cli epistemics lint
      - name: registro ontológico (RFC-004)
        run: cd backend && python -m corpusmith.cli ontology lint
      - name: HOME sintético para as ferramentas de operação
        run: python -c "from pathlib import Path; from corpusmith.bench import synthetic_bundle; synthetic_bundle(Path.home()/'corpusmith-ci', 40)"
      - name: invariantes INV-* reparáveis
        run: cd backend && CORPUSMITH_HOME=$HOME/corpusmith-ci python -m corpusmith.cli okf index && CORPUSMITH_HOME=$HOME/corpusmith-ci python -m corpusmith.cli doctor
      - name: backup verificável (manifesto + sha256)
        run: cd backend && CORPUSMITH_HOME=$HOME/corpusmith-ci python -m corpusmith.cli backup create && CORPUSMITH_HOME=$HOME/corpusmith-ci python -m corpusmith.cli backup verify
  # PR-0 (G-2): sem esta perna o ramo Leiden de PRODUÇÃO (igraph/leidenalg)
  # nunca é executado — só o fallback de componentes. Verde-por-skip sobre o
  # algoritmo que de fato roda não é verde.
  backend-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: git config --global user.email ci@corpusmith && git config --global user.name CI
      - run: pip install -e "backend[dev,ml]"
      - run: python -m pytest backend/tests -q -m ml
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: cd desktop && ELECTRON_SKIP_BINARY_DOWNLOAD=1 npm ci
      # F-UI: `tsc --noEmit` era o gate INTEIRO do frontend, e ele fica verde
      # com o `onClick` desligado — medido. `npm test` é o smoke que o
      # ADR-41.3 declarou faltar e do qual quatro entregas da vitrine
      # dependiam sem ter.
      - run: cd desktop && npm test
      - run: cd desktop && npx tsc --noEmit && npx vite build
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config -q
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: git config --global user.email ci@corpusmith && git config --global user.name CI
      - run: cargo test --workspace --manifest-path native/Cargo.toml
      - run: pip install maturin && maturin build --release -m native/crates/corpusmith-native-python/Cargo.toml -o native/target/wheels
      - run: cargo build --release --manifest-path native/Cargo.toml -p corpusmith-native-worker
      # O wheel era CONSTRUÍDO e nunca instalado, então
      # `pytest.importorskip("corpusmith_native")` fazia os testes
      # diferenciais do ADR-39 pularem em TODAS as pernas da CI: a
      # equivalência Rust≈Python — a única prova de que o acelerador não
      # muda o significado — nunca era exercitada. É o mesmo verde-por-skip
      # que a G-2 fechou para o ramo [ml] e o ADR-47 para o binário
      # empacotado: construir não é o mesmo que funcionar. Medido quando o
      # bump do PyO3 (0.23 → 0.29) quebrou a compilação: o que a CI teria
      # deixado passar em silêncio é a mudança de COMPORTAMENTO na
      # fronteira FFI, não a de sintaxe.
      - run: pip install -e "backend[dev]" && pip install native/target/wheels/*.whl
      - name: a extensão nativa é EXERCITADA, não só construída
        run: python -m pytest backend/tests/test_compute_differential.py backend/tests/test_compute_properties.py -q

  # PR-0.1: o caminho EMPACOTADO passa a ser construído E EXECUTADO pela CI.
  #
  # Verificado por execução que ele estava quebrado em QUATRO pontos, e nenhum
  # deles era visível sem rodar: `build.spec` sem `exclude_binaries` (não
  # construía), `collect_dynamic_libs` com o padrão default `lib*.so` que não
  # casa com `vec0.so` (embarcaria sem a extensão vetorial, em silêncio),
  # ponto de entrada apontando para o módulo e não para um `__main__` de
  # pacote (ImportError na primeira linha), e recursos resolvidos por
  # `parents[]` em vez de `_MEIPASS` (FileNotFoundError antes de abrir a
  # porta). Construir não é o mesmo que funcionar — por isso este job SOBE o
  # binário e bate no `/health`.
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: git config --global user.email ci@corpusmith && git config --global user.name CI
      # `[ml]` obrigatório: sem sqlite-vec o build.spec FALHA ALTO em vez de
      # embarcar um binário sem busca vetorial
      - run: pip install -e "backend[dev,ml]" pyinstaller
      - run: cd backend && pyinstaller build.spec
      - name: o binário empacotado SOBE e responde
        run: |
          export CORPUSMITH_HOME="$RUNNER_TEMP/pkg-home"
          mkdir -p "$CORPUSMITH_HOME"
          backend/dist/corpusmith-server/corpusmith-server &
          for i in $(seq 1 40); do
            J=$(find "$CORPUSMITH_HOME" -name daemon.json 2>/dev/null | head -1)
            [ -n "$J" ] && break; sleep 1
          done
          test -n "$J" || { echo "::error::o sidecar empacotado nao abriu a porta"; exit 1; }
          P=$(python -c "import json;print(json.load(open('$J'))['port'])")
          T=$(python -c "import json;print(json.load(open('$J'))['token'])")
          # daemon.json aparece ANTES de o uvicorn aceitar conexao (medido:
          # o run 32601684771 falhou com exit 7 e o processo VIVO no
          # cleanup, enquanto o run irmao do MESMO commit passou). O
          # primeiro curl ganha retry ate o socket abrir; os seguintes nao
          # precisam — se o health respondeu, o servidor esta de pe.
          H=""
          for i in $(seq 1 30); do
            H=$(curl -sf -m 5 "http://127.0.0.1:$P/health" -H "x-corpusmith-auth: $T") && break
            H=""; sleep 1
          done
          test -n "$H" || { echo "::error::o sidecar escreveu daemon.json mas nunca aceitou conexao"; exit 1; }
          echo "$H"
          curl -sf -m 20 "http://127.0.0.1:$P/system/doctor" -H "x-corpusmith-auth: $T" \
            | python -c "import json,sys; d=json.load(sys.stdin); \
                         sys.exit(0 if d['counts']['error']==0 else 1)"
          # o registro epistêmico é lido em RUNTIME e mora na raiz do repo:
          # fora dos `datas` do build.spec o app instalado responde
          # `registry_missing` e o painel Qualidade acusa "lint com erros"
          curl -sf -m 20 "http://127.0.0.1:$P/cockpit/epistemics" -H "x-corpusmith-auth: $T" \
            | python -c "import json,sys; d=json.load(sys.stdin)['lint']; \
                         sys.exit(0 if d['ok'] and d['mechanisms'] > 0 else 1)"
      - name: a extensao vetorial vec0 foi embarcada
        run: test -f backend/dist/corpusmith-server/_internal/sqlite_vec/vec0.so
