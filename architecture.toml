# architecture.toml — contrato de arquitetura LEGÍVEL POR MÁQUINA.
#
# Fonte única das regras estruturais para humanos E agentes de IA. NÃO é
# decorativo: `backend/tests/test_architecture_toml.py` cruza este arquivo
# com as asserções de `test_architecture.py` — se um divergir do outro, a
# suíte quebra. Assim a doc de arquitetura não pode mentir sobre o código.
#
# Referências: docs/10-engenharia-ai-friendly.md (spec BC-ENG-001) · AGENTS.md
schema_version = 1
product_version = "2.0.0"

[project]
name = "corpusmith"        # Corpusmith — the local-first governed knowledge compiler (ADR-53)
kind = "local-first knowledge & memory platform"
source_of_truth = ["knowledge/bundle (Markdown OKF)", "git"]
derived_stores = ["index.db"]           # reconstruível de rebuild_index
transport_allowed_only_in = ["api", "cli", "daemon", "models"]

# Gradiente de mutabilidade (interno = estável/puro → externo = volátil).
layers = [
  "kernel", "normalize", "cognitive", "epistemic",  # núcleo PURO (zero I/O)
  "okf", "harness", "retrieval",        # domínio canônico
  "usecases",                            # aplicação (1 método público)
  "facades",                             # orquestração
  "jobs", "api", "cli", "daemon", "models", "desktop",  # adapters
]

# --- núcleo PURO: nenhum destes imports pode aparecer (test_architecture:
#     FORBIDDEN_IN_PURE). epistemic/ (v1.6): contratos epistemológicos —
#     regras em epistemics.toml na raiz, loader em harness/epistemics.py. ---
[pure]
packages = ["kernel", "normalize", "cognitive", "epistemic"]
forbidden_imports = [
  "sqlite3", "httpx", "subprocess", "fastapi", "uvicorn", "git",
  "requests", "frontmatter", "yaml", "pydantic", "sse_starlette",
  "socket", "urllib", "pathlib",
]

# --- domínio livre de transporte (test_architecture: TRANSPORT). ---
[domain]
packages = ["okf", "harness", "usecases", "facades", "retrieval",
            "runtime", "cognitive", "epistemic", "compute"]
forbidden_imports = ["fastapi", "uvicorn", "sse_starlette", "socket",
                     "httpx", "requests", "urllib"]

# --- regra de dependência entre camadas. ---
[dependency_rule]
usecases_forbidden = ["facades", "api", "jobs"]   # + nenhum framework HTTP
api_allowed_internal = ["facades"]                # nunca usecases/jobs
memory_must_not_import = ["cognitive"]            # dependência unidirecional

[usecase]
single_public_method = "execute"                  # Object Calisthenics
machine_page_template_closed = true               # subclasses não sobrescrevem execute

# --- bancos e autoridade (docs/06 §3 · spec §5.1). ---
[[database]]
name = "runtime.db"
authority = "operacional"
rebuildable = false
schema_version = 10         # + pattern_verdicts (juízo humano sobre padrão computado)
[[database]]
name = "index.db"
authority = "nenhuma (projeção)"
rebuildable = true
schema_version = 10         # F4-PR2: page_overlay contested → low_yield (ADR-52)
[[database]]
name = "cold.db"
authority = "memória fria"
rebuildable = "parcial (via Git)"
schema_version = 1
[[database]]
name = "cognitive.db"
authority = "experiência (separada)"
rebuildable = false
schema_version = 2
[[database]]
name = "reference.db"
authority = "referência do mundo"
rebuildable = "parcial (via seed/import)"
schema_version = 1

# --- IMPOSIÇÃO do gate (PR-0, v1.8.1) ---
# Antes daqui o gate tinha QUATRO inventários divergentes (AGENTS.md §2 com
# 8 comandos, justfile com 3, ci.yml com 4, e [commands] abaixo) e nada os
# cruzava — então dez DoDs podiam dizer "gate completo" sobre algo que a CI
# nunca executava. `test_pr0_gate.py` cruza estas listas com
# .github/workflows/ci.yml e com a receita `verify` do justfile: o gate
# passa a ter UMA fonte, o mesmo tratamento que architecture.toml e
# epistemics.toml já recebem. Tokens, não linhas de comando: a CI escreve
# `pytest backend/tests` e o justfile `cd backend && … pytest tests`.
[gate]
# PR-0.1: `pyinstaller build.spec` entra no gate. Sem este token o
# `test_ci_executa_todo_o_gate_declarado` estruturalmente NUNCA poderia acusar
# que o caminho empacotado não é construído — e foi assim que ele passou meses
# quebrado em quatro pontos distintos, nenhum visível sem executar o binário.
# F-UI: `npm test` entra no gate. `tsc --noEmit` prova tipo, não
# comportamento — com o `onClick` do reparo desligado ele sai 0 e o smoke
# reprova. Era a única lacuna de processo que um ADR nomeava (41.3) e que
# não estava em G-1..G-10, portanto não entrou em fase nenhuma.
# RFC-004: `ontology lint` entra no gate pelo mesmo motivo que `epistemics
# lint` entrou — um registro normativo que ninguém executa não é normativo.
# Ele é o único guarda de que `ontology.toml` continua descrevendo o código:
# sem o token, um eixo pode ganhar valor novo sem verbete e a suíte segue
# verde no que importa (o lint tem findings que os testes de unidade não
# alcançam: refs de `lives_in` e marcadores de deriva vivem no filesystem).
# A extensão NATIVA entra no gate pelo mesmo motivo que o binário
# empacotado entrou (ADR-47): o wheel era construído e nunca instalado, e
# `pytest.importorskip("corpusmith_native")` fazia os testes diferenciais
# do ADR-39 pularem em TODAS as pernas. Sem este token, a perna que
# EXERCITA o acelerador pode ser removida da CI em silêncio e a suíte
# segue verde — que é exatamente como o verde-por-skip sobrevive.
ci_enforced = ["pytest", "tsc --noEmit", "npm test",
               "docker compose config",
               "cargo test", "epistemics lint", "ontology lint",
               "doctor", "backup",
               "pyinstaller build.spec",
               "test_compute_differential.py"]
verify_enforced = ["pytest", "tsc --noEmit", "npm test",
                   "docker compose config", "epistemics lint",
                   "ontology lint"]

# --- INVARIANTES: dono único da tabela do AGENTS.md §4 ---
# Antes daqui a tabela vivia em prosa em DOIS lugares (AGENTS §4 com 15
# linhas, docs/10 §1.2 com 16) e a coluna "Verificado por" citava arquivos
# que não são testes (INV-PRIV-001 → harness/local_policy.py, que só exige
# o campo `privacy`). `test_architecture_toml.py` cruza: os ids daqui são os
# do AGENTS §4, e todo `verified_by` resolve para um teste que existe.
# `arquivo.py::função`, ou só `arquivo.py` quando o arquivo inteiro é a prova.
[[invariant]]
id = "INV-ARCH-001"
rule = "kernel/, normalize/, cognitive/, epistemic/ sem I/O, rede, framework ou filesystem"
verified_by = ["test_architecture.py::test_kernel_and_normalize_are_pure"]
[[invariant]]
id = "INV-ARCH-002"
rule = "a memória NÃO importa o domínio cognitivo (dependência unidirecional)"
verified_by = ["test_architecture.py::test_memory_domain_does_not_depend_on_cognitive_domain"]
[[invariant]]
id = "INV-ARCH-003"
rule = "usecases/ não importam api/, jobs/ nem facades/"
verified_by = ["test_architecture.py::test_usecases_do_not_reach_outward"]
[[invariant]]
id = "INV-ARCH-004"
rule = "api/ só chama facades"
verified_by = ["test_architecture.py::test_api_speaks_only_to_facades"]
[[invariant]]
id = "INV-ARCH-005"
rule = "todo UseCase expõe só execute()"
verified_by = ["test_architecture.py::test_every_usecase_has_single_public_method"]
[[invariant]]
id = "INV-ARCH-006"
rule = "subclasses de MachinePageUseCase não sobrescrevem execute()"
verified_by = ["test_architecture.py::test_machine_page_template_is_closed_for_modification"]
[[invariant]]
id = "INV-DATA-001"
rule = "escrita canônica passa pelo Harness + BundleWriter (página + log + commit)"
verified_by = ["test_writer.py::test_write_creates_page_log_and_commit",
               "test_local_policy.py::test_privacy_is_required_for_every_written_page"]
[[invariant]]
id = "INV-DATA-002"
rule = "página supersedida fica auditável e FORA do retrieval padrão"
verified_by = ["test_v22.py::test_inv003_superseded_out_of_default_retrieval"]
[[invariant]]
id = "INV-DATA-003"
rule = "index.db é reconstruível do bundle"
verified_by = ["test_v22.py::test_inv002_index_generation_change_forces_full_rebuild",
               "test_doctor.py::test_repair_rebuilds_and_clears_orphan"]
[[invariant]]
id = "INV-DATA-004"
rule = "falha cognitiva NÃO altera confiança/validade canônicas"
verified_by = ["test_cognitive_journey.py::test_full_journey_preserves_canonical_memory"]
[[invariant]]
id = "INV-PRIV-001"
rule = "conteúdo local_only não sai da máquina"
# A metade do EXPORT está presa; a metade do MODELO (o roteador nunca
# chama o provedor de API para local_only) segue sem teste — nfr.toml
# NFR-PRIV-002 declara a lacuna em vez de fingir que local_policy.py a cobre.
verified_by = ["test_fase5.py::test_export_respects_privacy_and_formats",
               "test_local_policy.py::test_privacy_is_required_for_every_written_page"]
[[invariant]]
id = "INV-OPS-001"
rule = "config aplicada tem linhagem, validação e rollback"
verified_by = ["test_v16.py::test_tune_records_history_and_ring_evicts_beyond_30",
               "test_v16.py::test_rollback_returns_to_previous_generation",
               "test_v16.py::test_tune_rejects_wrong_type_and_unknown_key_without_side_effects"]
[[invariant]]
id = "INV-OPS-002"
rule = "todo job termina em estado terminal ou permanece recuperável"
verified_by = ["test_jobs_reliability.py::test_orphaned_lease_is_recovered",
               "test_jobs_reliability.py::test_startup_sweep_recovers_leased_and_cancel_requested"]
[[invariant]]
id = "INV-EPI-001"
rule = "mecanismo heurístico tem contrato em epistemics.toml: sem garantia universal, com vieses/failure modes/fallback e sem autocertificação"
verified_by = ["test_epistemics.py", "test_epistemics_toml.py"]
[[invariant]]
id = "INV-ONT-001"
rule = "todo valor de eixo epistêmico responde a UMA pergunta: vocabulário fechado no kernel, declarado em ontology.toml, nenhum termo em dois eixos"
verified_by = ["test_ontology.py::test_toml_declara_o_vocabulario_real_do_kernel",
               "test_ontology.py::test_nenhum_valor_responde_a_duas_perguntas"]

# --- comandos de verificação (o gate único da spec §14.4). ---
[commands]
backend_tests = "cd backend && .venv/bin/python -m pytest tests -q"
desktop_typecheck = "cd desktop && npx tsc --noEmit"
compose_check = "docker compose config -q"
doctor = "cd backend && .venv/bin/python -m corpusmith.cli doctor"
backup = "cd backend && .venv/bin/python -m corpusmith.cli backup create"
epistemics_lint = "cd backend && .venv/bin/python -m corpusmith.cli epistemics lint"
ontology_lint = "cd backend && .venv/bin/python -m corpusmith.cli ontology lint"
models_resolve = "cd backend && .venv/bin/python -m corpusmith.cli models"
bench = "cd backend && .venv/bin/python -m corpusmith.cli bench compare"
native_tests = "cargo test --workspace --manifest-path native/Cargo.toml"
native_wheel = "maturin build --release -m native/crates/corpusmith-native-python/Cargo.toml"
