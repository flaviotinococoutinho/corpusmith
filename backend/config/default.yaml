# llmwiki — configuração default (Parte V §4.2 + Manual Ap. D + v0.6 §5.5)
home: ~/llmwiki

paths:
  knowledge: knowledge
  adapters: adapters
  models: models
  logs: logs

server:
  host: 127.0.0.1
  port: 8377

# Privacidade: NADA sai da máquina sem regra explícita liberando (v0.6 §5.5)
privacy:
  default: local_only
  rules: []
  # exemplo:
  # - pattern: "raw/public/**"
  #   privacy: api_allowed

budget:
  daily_usd: 2.0

policy:
  citation_required: true   # política LOCAL — SPEC trata # Citations como SHOULD

# feature flags (v0.8)
flags:
  retrieval.descend: true       # descida hierárquica L0/L1 no /ask
  reconcile.llm_arbiter: false  # LLM local decide a zona cinzenta do reconcile

ask:
  abstain_threshold: 0.0        # score RRF mínimo; 0 = abstém só sem evidência

# base fria (v0.12): esquecer = compactar, nunca destruir
memory:
  freeze_tau: 0.0               # limiar de recuperação ACT-R (τ)
  activation_noise: 0.4         # ruído da ativação (s)
  max_recall_probability: 0.05  # P(recall) acima disso ⇒ VETO ao freeze
  min_idle_days: 90             # janela mínima de ociosidade
  auto_recycle: false           # fallback do /ask reidrata sozinho?

models:
  local:
    provider: ollama
    base_url: http://127.0.0.1:11434
    # ESCADA de preferência (ADR-42): vence a primeira entrada que esteja
    # instalada E cujos pesos caibam em memory_fraction da RAM total. O
    # roteador nunca baixa nada sozinho — use scripts/pull_models.sh.
    chat:
      - qwen3-vl:8b-instruct     # preferido (~6.1 GB de pesos; pede 16 GB+)
      - qwen3-vl:4b-instruct     # ~3.3 GB
      - qwen3-vl:4b              # ~3.3 GB (variante thinking)
      - qwen3-vl:2b-instruct     # ~1.9 GB; alcança máquinas de 8 GB
      - qwen2.5:7b-instruct      # compat com instalações < v1.9
    embed: nomic-embed-text
    memory_fraction: 0.6
  api:
    provider: anthropic
    chat: claude-haiku-4-5-20251001

worker:
  heavy_slots: 1
  light_slots: 2
  poll_seconds: 1.0
