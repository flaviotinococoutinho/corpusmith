[project]
name = "corpusmith"
version = "2.0.0"
description = "Corpusmith — knowledge base OKF local-first com cockpit de memória agêntica"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "sse-starlette>=2.1",
    "pydantic>=2.7",
    "python-frontmatter>=1.1",
    "PyYAML>=6.0",
    "GitPython>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
# parsers AGPL ficam FORA do binário PyInstaller (§8.1): instalados no venv
# e chamados em subprocesso por ingestion/extract.py
parsers = ["pymupdf4llm>=0.0.17", "ebooklib>=0.18"]
ml = ["sqlite-vec>=0.1", "igraph>=0.11", "leidenalg>=0.10"]
dev = ["pytest>=8.0", "hypothesis>=6.100"]   # property tests (ADR-39 §15)

[project.scripts]
corpusmith = "corpusmith.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# PR-0: o extra [ml] traz igraph/leidenalg — o ramo de particionamento de
# PRODUÇÃO. Sem esta perna na CI, só o fallback de componentes é exercitado.
markers = [
  "ml: exige o extra [ml] (igraph/leidenalg) — perna backend-ml da CI",
]
