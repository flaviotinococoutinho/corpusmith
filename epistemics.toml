  "alias disputado que ninguém usa gera finding sem página de uso: é dívida de vocabulário, não de conteúdo, e a mensagem diz isso em vez de inventar urgência",
  "detector de PRIORIDADE MAIOR resolve o span antes: `PRIORITY` dá standard=4 e identifier=5 contra entity=1, então um alias curado que colida com uma norma (`iso 9001`) é lido como `standard` e resolve normal — a ambiguidade não aparece naquele span, a página não entra em `pages`, e o finding do vocabulário fica sem uso registrado",
  "o dedup é por (canônico, autoridade, qid): dois registros com o MESMO canônico e autoridades diferentes são duas identidades, não uma — e aparecem como conflito, que é a leitura honesta de dois curadores discordando sobre o que a palavra classifica",
]
