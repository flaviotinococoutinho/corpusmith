# epistemics.toml — REGISTRO DE CONTRATOS EPISTEMOLÓGICOS (ADR-38, v1.6).
#
# Fonte normativa dos pressupostos dos mecanismos heurísticos/adaptativos,
# como architecture.toml é a fonte dos contratos estruturais. NÃO é
# decorativo: `backend/tests/test_epistemics_toml.py` cruza os parâmetros
# declarados aqui com as constantes reais do código, e
# `corpusmith epistemics lint` (mesma implementação da API e do painel)
# valida as regras obrigatórias — contrato que mente sobre o código quebra
# a suíte.
#
# Vocabulários fechados (epistemic/model.py): guarantee_kind ∈
# deterministic|property_tested|empirical|calibrated_empirical|
# probabilistic|online_regret_relative|heuristic|formal|none · fallback ∈
# abstain|deterministic_fallback|request_human_review|degrade|
# duplicate_in_doubt|no_decision · evidence ∈ golden_set|human_feedback|
# deterministic_check|property_test|independent_validator|self_reported.
#
# universal_guarantee = true é PROIBIDO (lint) — toda garantia declara a
# que é relativa. Evidência composta só por self_reported é PROIBIDA
# (não-autocertificação).
schema_version = 1

[registry]
version = "1.14.0"  # RFC-006 V4: `explanation_difficulty` entra (onde o estudo trava)

# ============================================================ retrieval
[mechanisms.retrieval_rrf_hedge]
title = "Retrieval multi-stream com fusão RRF ponderada por crédito Hedge"
decision = "ordenar evidências candidatas do bundle para responder uma consulta"
implementation_refs = [
  "backend/src/corpusmith/retrieval/streams.py",
  "backend/src/corpusmith/usecases/ask_memory.py",
  "backend/src/corpusmith/kernel/information.py",
  "backend/src/corpusmith/usecases/record_outcome.py",
]
inductive_biases = [
  "evidência relevante tende a aparecer bem posicionada em pelo menos um stream (fts, dense, entity, graph, descend, global)",
  "posições em rankings são mais comparáveis que scores brutos heterogêneos (por isso RRF, não soma de scores)",
  "desfechos passados (useful/dead_end/corrected) contêm informação sobre a utilidade futura de cada stream",
  "vizinhança no grafo de links importa: fatos a 1+ saltos das entidades da pergunta são alcançáveis por PPR (HippoRAG)",
]
assumptions = [
  "o regime de consultas não muda abruptamente (os pesos aprendidos continuam informativos)",
  "os desfechos registrados pelo usuário representam utilidade real, não humor do momento",
  "os streams têm diversidade suficiente de erros (falha correlacionada anula o ganho da fusão)",
]
validity_scope = [
  "consultas sobre o bundle local (não sobre o mundo aberto)",
  "streams registrados em stream_weights e presentes na consulta corrente",
  "idiomas e domínios presentes no golden set (hoje: casos do bundle do usuário, pt-BR dominante)",
]
known_failure_modes = [
  "feedback escasso ou sistematicamente enviesado (poucos outcomes ⇒ pesos ~1.0, fusão não aprendeu nada)",
  "mudança abrupta na distribuição de consultas (concept drift; o clamp acelera a readaptação mas não a elimina)",
  "falha correlacionada de todos os streams (pergunta fora da cobertura do corpus)",
  "loss atribuído por página, não por stream individual: streams que co-trouxeram a página dividem o mesmo julgamento",
  "o clamp satura em 3 desfechos consecutivos (medido: 1.0→1.284→1.649→2.0 no teto; 1.0→0.779→0.607→0.5 no piso) — a partir daí evidência adicional na mesma direção tem efeito ZERO: o peso é um contador de 3 passos, não uma distribuição minimizadora de arrependimento",
]
# C13 (docs/17): rebaixado de online_regret_relative — o bound do Hedge
# (Freund & Schapire) exige perda de TODOS os experts por rodada, e
# record_outcome só atualiza os streams CONTRIBUINTES (bandit sem correção
# de amostragem). Mesma honestidade do segundo uso do kernel
# (adaptive_strategy_selection), que sempre declarou heuristic.
guarantee_kind = "heuristic"
guarantee_relative_to = "fusão proporcional a pesos multiplicativos sobre desfechos observados; SEM bound formal de arrependimento no regime bandit implementado (só os streams contribuintes recebem loss, sem correção de amostragem) e com clamp [0.5, 2.0] que troca a distribuição por exploração garantida (nenhum stream é silenciado para sempre)"
universal_guarantee = false
fallback = ["degrade"]
adaptive = true
feedback_signal = "ask_outcomes (useful=-1, dead_end/corrected=+1) roteado por ask_provenance página→stream (RecordOutcome._update_stream_credit)"
evidence = ["golden_set", "human_feedback"]
evaluated_by = ["eval_memory"]
misinterpretations = [
  "Hedge compete com o melhor stream fixo observado; não garante ótimo universal nem relevância objetiva",
  "peso alto de um stream não significa que a resposta é verdadeira — significa histórico de desfechos úteis",
]
high_impact = false
abstention_supported = true
human_review_available = true
[mechanisms.retrieval_rrf_hedge.parameters]
rrf_k = 60
hedge_eta = 0.25
hedge_clamp_floor = 0.5
hedge_clamp_ceiling = 2.0
loss_useful = -1.0
loss_not_useful = 1.0
overlay_preferred_boost = 1.15
overlay_low_yield_penalty = 0.8

[mechanisms.evidence_sufficiency]
title = "Suficiência de evidência (support 2D ao lado da dispersão)"
decision = "quantificar QUANTA evidência sustenta a resposta do /ask — o eixo que a uncertainty (dispersão) não mede e inverte na base rasa"
implementation_refs = [
  "backend/src/corpusmith/kernel/sufficiency.py",
  "backend/src/corpusmith/usecases/ask_memory.py",
]
inductive_biases = [
  "mais páginas distintas corroborando = sustentação maior (satura em 3: além disso é redundância, não suficiência)",
  "mais streams independentes trazendo a mesma evidência = menos dependência de um único índice (satura em 3)",
  "evidência aterrada por span (v1.8) é conferível a olho — vale mais que texto sem âncora",
  "evidência fresca (nem stale nem superseded) sustenta mais que suspeita",
]
assumptions = [
  "as quatro parcelas capturam eixos INDEPENDENTES de sustentação (não há dupla contagem relevante entre elas)",
  "média simples das parcelas é um agregador razoável — nenhum peso foi calibrado",
]
validity_scope = [
  "respostas do /ask sobre o bundle local; publicado AO LADO de uncertainty, nunca no lugar",
]
known_failure_modes = [
  "as saturações (3 páginas, 3 streams) são limiares de PROJETO, não calibrados — a porta de reentrada do ADR-52 é calibrá-los contra o golden",
  "support alto não valida a resposta: 3 páginas erradas que concordam pontuam como 3 certas (mede sustentação, não verdade)",
  "grounded_fraction depende do gazetteer: pergunta sem entidade conhecida zera a parcela mesmo com evidência boa",
]
guarantee_kind = "heuristic"
guarantee_relative_to = "composição normalizada de quatro contagens observáveis do próprio request — sem calibração empírica; a propriedade TESTADA é a que motivou o mecanismo: base rasa ⇒ support baixo mesmo com uncertainty 0"
universal_guarantee = false
fallback = ["no_decision"]
adaptive = false
feedback_signal = ""
composite = true
composite_components = ["distinct_pages", "corroborating_streams", "grounded_fraction", "freshness"]
evidence = ["deterministic_check"]
misinterpretations = [
  "support NÃO é probabilidade de verdade — é contagem de sustentação; o eixo factual segue sendo desfecho observado + Brier",
  "uncertainty continua publicada e continua significando DISPERSÃO",
]
high_impact = false
abstention_supported = false
human_review_available = false
[mechanisms.evidence_sufficiency.parameters]
pages_saturation = 3
streams_saturation = 3

[mechanisms.retrieval_uncertainty]
title = "Incerteza de retrieval por entropia normalizada da fusão"
decision = "quantificar a DISPERSÃO da evidência fundida (sinal para hedging na UI e insumo da abstenção)"
implementation_refs = [
  "backend/src/corpusmith/retrieval/streams.py",
  "backend/src/corpusmith/kernel/information.py",
]
inductive_biases = [
  "massa de score espalhada entre muitos chunks indica que o sistema não sabe onde está a resposta (parente do semantic entropy de Kuhn et al. 2023)",
  "massa concentrada num chunk indica evidência localizada — o que NÃO é o mesmo que evidência correta",
]
assumptions = [
  "a distribuição de scores RRF dos top-12 é um proxy razoável da concentração de evidência",
  "os streams cobrem o espaço de respostas plausíveis (entropia baixa por cobertura pobre é falsa certeza)",
]
validity_scope = [
  "distribuições de score da fusão RRF corrente (top-12 hits ordenados)",
  "uso como sinal RELATIVO na mesma base — não comparável entre bundles diferentes",
]
known_failure_modes = [
  "evidência concentrada E incorreta: entropia baixa, resposta errada (falsa confiança)",
  "base minúscula: com <2 hits positivos a entropia é 0 por construção, não por certeza",
  "1 − uncertainty é gravado como `confidence` em ask_context e alimenta a calibração — se lido como probabilidade de verdade, o Brier mede a heurística errada",
]
guarantee_kind = "heuristic"
guarantee_relative_to = "dispersão da distribuição de scores fundidos — mede espalhamento de evidência, não verdade factual"
universal_guarantee = false
fallback = ["no_decision"]
adaptive = false
feedback_signal = ""
evidence = ["deterministic_check", "human_feedback"]
misinterpretations = [
  "a incerteza mede dispersão do retrieval, NÃO é probabilidade de a afirmação ser verdadeira",
  "não substitui calibração factual (Brier sobre desfechos observados é o eixo separado)",
  "entropia baixa não valida a resposta: pode haver evidência concentrada e incorreta",
]
high_impact = false
abstention_supported = false
human_review_available = false
[mechanisms.retrieval_uncertainty.parameters]
entropy_window_hits = 12
ui_hedge_threshold = 0.85

[mechanisms.abstention]
title = "Abstenção com fallback determinístico para a base fria"
decision = "responder OU confessar ausência de cobertura (custo de silêncio < custo de resposta fabricada)"
implementation_refs = [
  "backend/src/corpusmith/usecases/ask_memory.py",
]
inductive_biases = [
  "evidência vazia ou top_score abaixo do limiar indica ausência de cobertura, não resposta difícil",
  "memória congelada que casa com a pergunta é melhor pista que uma resposta fabricada (cold_matches)",
]
assumptions = [
  "o limiar ask.abstain_threshold está calibrado para o bundle do usuário (default 0.0 = abstém só com evidência vazia)",
  "o usuário prefere um 'não sei' com lacunas nomeadas a uma alucinação plausível",
]
validity_scope = [
  "consultas /ask sobre o bundle local; categorias expect_abstain do golden set",
]
known_failure_modes = [
  "falso silêncio: limiar alto demais abstém com evidência utilizável (custo: fricção, perda de confiança no sistema)",
  "resposta fabricada: limiar baixo demais responde sem cobertura (custo: erro citado como fato — pior que o silêncio)",
  "default 0.0 significa que score baixo-mas-positivo NUNCA abstém — a proteção real depende de calibrar o limiar",
]
guarantee_kind = "heuristic"
guarantee_relative_to = "limiar configurado sobre o top_score da fusão; graded no golden set pela categoria expect_abstain"
universal_guarantee = false
fallback = ["abstain", "deterministic_fallback"]
adaptive = false
feedback_signal = ""
evidence = ["golden_set", "human_feedback"]
evaluated_by = ["eval_memory"]
misinterpretations = [
  "abstenção não é prova de que a resposta não existe no mundo — só de que não há cobertura NA BASE",
  "o fallback extrativo (modelo indisponível) é degradação, não abstenção: são caminhos distintos",
]
high_impact = true
abstention_supported = true
human_review_available = true
[mechanisms.abstention.parameters]
threshold_config_key = "ask.abstain_threshold"
threshold_default = 0.0

# ======================================================== reconciliação
[mechanisms.memory_freeze]
title = "Esquecimento por congelamento ACT-R (freeze para a base fria; recycle de volta)"
decision = "remover uma página da memória QUENTE (retrieval padrão) para a base fria — e reidratá-la quando cold_matches casarem com a pergunta"
implementation_refs = [
  "backend/src/corpusmith/usecases/cold_memory.py",
  "backend/src/corpusmith/kernel/activation.py",
]
inductive_biases = [
  "a ativação de nível-base do ACT-R (Anderson et al. 2004) prevê recuperabilidade a partir do histórico de USO — o que foi lido tende a ser pedido de novo",
  "página sem dependente TMS e fora do overlay preferred pode sair do retrieval sem quebrar raciocínio de terceiros",
]
assumptions = [
  "page_heat (reads/cites por caminho) representa uso real — não distingue leitura por engano de leitura por valor",
  "o decay canônico d=0.5, calibrado em experimentos de memória humana, transfere para memória de conhecimento pessoal (NÃO recalibrado neste produto)",
  "os limiares default (P(recall) 0.05, ócio 90d) fazem sentido para o bundle do usuário — nenhum foi calibrado em dado real",
]
validity_scope = [
  "páginas com heat registrado, de tipos não protegidos, sem dependentes TMS",
  "decisão CONSERVADORA: na dúvida (qualquer gate), veta — congelar exige passar por todos",
]
known_failure_modes = [
  "P(recall) é PROXY de heat de LEITURA, não de compreensão nem de valor: página valiosa raramente aberta congela; página ruim muito aberta fica",
  "heat ausente ⇒ ativação -inf: página nunca lida é candidata imediata (o gate de ócio só protege quem já foi usado)",
  "force=True fura os gates de overlay/recall/ócio — tipo protegido e dependentes TMS seguem vetando, o resto cede ao humano",
  "com memory.auto_recycle ligado, uma CONSULTA /ask que case com o digest frio ESCREVE no bundle e commita (RecycleMemory) — leitura com efeito colateral canônico, sem gate humano no caminho",
]
guarantee_kind = "heuristic"
guarantee_relative_to = "cadeia determinística de vetos sobre um modelo psicológico (ACT-R) cujos limiares NÃO foram calibrados no bundle real — a garantia é a reversibilidade (esquecer = compactar, nunca destruir; o digest fica na base fria e o recycle restaura), não a justeza da seleção"
universal_guarantee = false
fallback = ["no_decision"]
adaptive = false
feedback_signal = ""
evidence = ["deterministic_check", "human_feedback"]
misinterpretations = [
  "congelar não é apagar: o conteúdo integral segue no Git e o digest na base fria — FreezeVeto é a saída normal, não erro",
  "P(recall) alto não significa página boa — significa página LIDA",
]
high_impact = true
abstention_supported = false
human_review_available = true
[mechanisms.memory_freeze.parameters]
max_recall_probability_default = 0.05
min_idle_days_default = 90
freeze_tau_default = 0.0
activation_noise_default = 0.4
actr_decay = 0.5

[mechanisms.consolidate_inbox]
title = "Consolidação do inbox por clusters SimHash"
decision = "agrupar notas cruas near-duplicadas e compilar UMA página por cluster (uma chamada de LLM por cluster, não uma por nota)"
implementation_refs = [
  "backend/src/corpusmith/usecases/consolidate_inbox.py",
  "backend/src/corpusmith/kernel/sketch.py",
]
inductive_biases = [
  "textos near-duplicados compartilham a maioria dos shingles de 3 palavras — SimHash (Charikar 2002) aproxima essa sobreposição em 64 bits",
  "entidades compartilhadas entre os membros confirmam a coesão do cluster (interseção, não união)",
]
assumptions = [
  "a janela text[:100_000] representa o documento (cauda além disso não muda o sketch)",
  "hamming <= 8 em 64 bits separa duplicata de coincidência no inbox típico",
]
validity_scope = [
  "notas de texto do inbox (raw/); recorrência DETERMINÍSTICA, sem embeddings",
]
known_failure_modes = [
  "texto curto: poucos shingles tornam o sketch instável (simhash de vazio = 0)",
  "paráfrase profunda escapa: SimHash é LEXICAL, não semântico — mesmo fato reescrito não clusteriza",
  "boilerplate compartilhado (cabeçalho/rodapé idênticos) domina os shingles e produz falso cluster",
]
guarantee_kind = "heuristic"
guarantee_relative_to = "distância de Hamming <= 8 sobre SimHash de 64 bits com shingles de 3 palavras — limiar de projeto, não calibrado em corpus real; fora de cluster nada se perde (a fonte fica pendente para o compile individual)"
universal_guarantee = false
fallback = ["no_decision"]
adaptive = false
feedback_signal = ""
evidence = ["deterministic_check"]
misinterpretations = [
  "cluster não é juízo de MÉRITO: é sobreposição lexical — a página compilada passa pelo mesmo Harness de qualquer escrita",
]
high_impact = false
abstention_supported = false
human_review_available = true
[mechanisms.consolidate_inbox.parameters]
near_duplicate_hamming = 8
simhash_shingle = 3
text_window_chars = 100000

[mechanisms.reconciliation]
title = "Reconciliação ADD/UPDATE/SUPERSEDE/NOOP/RECYCLE por escada determinística"
decision = "decidir se um candidato compilado é novo (ADD), atualiza (UPDATE), substitui (SUPERSEDE), nada acrescenta (NOOP) ou reidrata memória fria (RECYCLE)"
implementation_refs = [
  "backend/src/corpusmith/usecases/reconcile_candidate.py",
  "backend/src/corpusmith/usecases/promote_memory.py",
  "backend/src/corpusmith/kernel/information.py",
]
inductive_biases = [
  "identificador forte compartilhado (doi, isbn, issn, arxiv, git_sha) identifica o mesmo objeto do mundo — determinístico, precede tudo",
  "textos sobre o mesmo objeto comprimem-se mutuamente (NCD, Cilibrasi & Vitányi 2005) — sinal barato, imune a paráfrase superficial",
  "similaridade composta = 0.4·rank(FTS título) + 0.3·Jaccard(entidades) + 0.3·(1−NCD)",
  "na dúvida, duplicar: duplicação é REVERSÍVEL (consolidação futura resolve); fusão errada é DESTRUTIVA",
]
assumptions = [
  "os cortes HI=0.82 / LO=0.55 separam mesmo-objeto de objetos-distintos no corpus típico — NÃO calibrados: o degrau de similaridade não executou da v0.9 ao F3-PR0 (bm25 dentro de agregado estourava em toda execução), então nenhum escore jamais os cruzou. Calibrar exige golden set (RFC-002 §12)",
  "entidades extraídas pelo normalizador representam o conteúdo (Jaccard sobre entidades ruins degrada o sinal)",
]
validity_scope = [
  "candidatos do pipeline de compilação contra o bundle local e a base fria",
  "promoção humana (F3-PR1, RFC-003): a escada INFORMA a colisão e devolve op=COLLISION sem escrever — no caminho humano ela nunca decide, decide quem promove",
  "textos em que zlib captura redundância (NCD com corpos truncados em 8000 chars)",
  "índice FRESCO em relação ao bundle — quando não é, a escada reindexa antes de decidir e, se ainda assim não ficar fresco, declara index_stale na decisão (RFC-002 §4.2)",
]
known_failure_modes = [
  "zona cinzenta [0.55, 0.82) sem árbitro: cai em ADD — pode duplicar conceito existente (aceito por projeto: precisão > recall)",
  "árbitro LLM local (flag reconcile.llm_arbiter) responde JSON inválido ou fica indisponível: silenciosamente vira ADD",
  "identificador forte FALSO no texto (ex.: DOI citado, não do documento) força UPDATE errado — o único degrau capaz de fusão destrutiva",
  "index.db é PROJEÇÃO usada como autoridade nos degraus 1 e 2: índice atrasado esconde a página existente e produz ADD — duas páginas canônicas vivas para o mesmo DOI (medido, docs/17 B2). Mitigado pela pré-condição de frescor; o resíduo vai marcado como index_stale",
  "sem entidade curada no bundle o termo Jaccard vale 0 e o teto do escore é ~0.7 (< HI): corpo idêntico NÃO vira UPDATE, cai na zona cinzenta (medido, RFC-002 §4.3)",
]
guarantee_kind = "heuristic"
guarantee_relative_to = "escada determinística (identificadores) primeiro; heurística composta calibrada nos cortes HI/LO depois; trilha completa em reconcile_log"
universal_guarantee = false
fallback = ["duplicate_in_doubt", "request_human_review"]
adaptive = false
feedback_signal = ""
evidence = ["deterministic_check", "property_test"]
misinterpretations = [
  "score ≥ HI significa 'similar o suficiente para UPDATE', não identidade provada — só o degrau de identificador forte prova identidade",
  "confidence extracted/inferred/ambiguous da decisão é PROVENIÊNCIA do degrau, não probabilidade de acerto",
]
high_impact = true
abstention_supported = false
human_review_available = true
[mechanisms.reconciliation.parameters]
similarity_hi = 0.82
similarity_lo = 0.55
weight_title_rank = 0.4
weight_jaccard = 0.3
weight_ncd = 0.3
ncd_body_window = 8000
strong_ids = "doi,isbn,issn,arxiv,git_sha"
page_limit = 8
chunk_limit = 64

# ---------------------------------------------------------- fila de atenção
# F3-PR2 (P-3). `docs/14` §4 declarava este contrato OBRIGATÓRIO e ele não
# existia: a fila da v1.8 — a superfície que ORDENA o que o usuário faz com o
# tempo dele — não tinha contrato nenhum, e o lint o listava como um dos cinco
# `mechanism_promised`. Os failure modes abaixo são os do plano, verbatim,
# mais os dois que a F3 mediu ao consertar a fila.
[mechanisms.attention_queue]
title = "Fila única de próxima ação (ranking por densidade valor/custo)"
decision = "ordenar o que merece a atenção do curador agora, unificando revisão espaçada, lacunas, inbox, pontes frágeis e contradições candidatas"
implementation_refs = [
  "backend/src/corpusmith/usecases/next_actions.py",
  "backend/src/corpusmith/usecases/plan_attention.py",
  "backend/src/corpusmith/kernel/vitality.py",
  "backend/src/corpusmith/kernel/attention.py",
]
inductive_biases = [
  "densidade valor/custo (VoI por minuto) ordena melhor que valor absoluto — item caríssimo de valor alto não deve afogar cinco baratos",
  "custo é leitura estimada a 150 palavras/min com piso de 2 min",
  "revisão vale mais na zona de esforço produtivo: review_gain(p) = 4p(1−p) (Bjork 1994) — o trivial e o perdido rendem pouco",
  "valor por tipo é fixo e declarado (pergunta 0.9 > contradição 0.85 > baixo rendimento 0.8 > stale 0.6 > inbox 0.5), não aprendido",
]
assumptions = [
  "page_heat (leituras e citações) aproxima o uso real da página",
  "os pesos por tipo refletem a preferência vigente do curador — não há ground truth de prioridade contra o qual calibrá-los",
  "o alvo de um item ainda EXISTE e ainda aceita trabalho — pressuposto que era falso até o F3-PR2 e agora é verificado (kernel/vitality.py)",
]
validity_scope = [
  "bundle local com histórico de uso registrado em page_heat",
  "itens cujo alvo está vivo: sem superseded_by, sem invalid_at, e presente no bundle",
]
known_failure_modes = [
  "página NUNCA LIDA pode ser a mais valiosa e apenas não ter sido procurada — a fila é cega para o que não tem histórico",
  "recorrência não é importância: reler muito uma página pode significar que ela está mal escrita, não que é central",
  "custo por palavras/min ignora dificuldade — 300 palavras de matemática não custam o mesmo que 300 de prosa",
  "medido no F3-PR2: sem filtro de vitalidade a fila propunha revisar página aposentada e página inexistente, porque page_heat é chaveado por caminho e ninguém o confrontava com a autoridade",
  "veredito humano sobre padrão computado (ponte, contradição) precisa de pattern_verdicts com until: apagar a linha do padrão seria desfeito na próxima recomputação do job",
