[mechanisms.alias_conflict]
title = "Alias disputado por duas identidades curadas"
decision = "recusar a resolver um alias reivindicado por 2+ identidades da mesma camada — marcar o uso como AMBÍGUO e propor ao curador a edição que desambigua, nunca escolher um sentido"
