]
inductive_biases = [
  "precedência entre CAMADAS é resolução, colisão DENTRO da camada é ambiguidade: seeds embutidos e reference.db são defaults, authority_record no bundle é curadoria — a curadoria vence e isso não é conflito (regra de sempre, v0.22)",
  "o sentido é parte da IDENTIDADE e mora no canônico (`Entropia (física)`), não num campo paralelo: campo `sense` separado criaria dois donos do mesmo fato, e o campo `authority` já carrega cinco sentidos (drift ABERTA)",
  "não decidir é melhor que decidir errado: um alias disputado produz `confidence=ambiguous`, que toda a cadeia já respeita — não reescreve o texto, não indexa entidade e não lista no frontmatter; como aresta de grafo nasce de LINK e não de entidade, o termo deixa de LIGAR páginas em vez de ligá-las com peso menor",
]
assumptions = [
  "dois registros curados que reivindicam o mesmo alias representam sentidos DIFERENTES — se representam o mesmo, o canônico é o mesmo e a dedup os funde antes de virar conflito",
  "o parse do qualificador (um parêntese FINAL, sem aninhamento) reflete a intenção do curador; ele NÃO decide identidade, que é o canônico inteiro comparado por igualdade",
]
validity_scope = [
  "aliases de ENTIDADE do gazetteer (seeds ∪ reference.db ∪ authority_records) — identificadores fortes, normas, datas e quantidades têm outros donos e não passam por aqui",
  "conflito DENTRO da camada de maior precedência que reivindica cada alias",
  "só lint de corpus (`check_corpus`) e painel — jamais o gate de escrita, jamais severidade error",
]
known_failure_modes = [
  "RECALL LIMITADO AO QUE FOI CURADO — o modo de falha central: o detector só vê ambiguidade que alguém já escreveu em DOIS registros. Um bundle sem authority_record tem zero conflitos e vocabulário inteiramente por resolver; ausência de finding NÃO é vocabulário desambiguado",
  "ambiguidade de sentido que ninguém declarou continua colapsando: se um único registro reivindica `entropia` para um sentido só, o outro sentido é lido como aquele — silenciosamente, como antes desta mudança",
