# Workspace do compute plane nativo (ADR-39). Regra: Rust calcula
# SINAIS e PROJEÇÕES; Python decide o significado. Nenhum crate aqui
# escreve no bundle canônico nem decide ADD/UPDATE/SUPERSEDE/abstenção.
[workspace]
resolver = "2"
members = [
  "crates/braincore-types",
  "crates/braincore-graph",
  "crates/braincore-sketch",
  "crates/braincore-text",
  "crates/braincore-etl",
  "crates/llmwiki-native-python",
  "crates/llmwiki-native-worker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake2 = "0.10"
regex = "1"
rayon = "1"
unicode-general-category = "1"
