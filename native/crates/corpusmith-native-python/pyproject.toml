[build-system]
requires = ["maturin>=1.5,<2"]
build-backend = "maturin"

[project]
name = "corpusmith-native"
version = "0.1.0"
description = "Compute plane nativo do Corpusmith (ADR-39) — PPR/Brandes/SimHash em Rust; Python decide o significado"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.maturin]
module-name = "corpusmith_native"
