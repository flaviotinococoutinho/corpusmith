[package]
name = "llmwiki-native-python"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "llmwiki_native"
crate-type = ["cdylib"]

[dependencies]
braincore-types = { path = "../braincore-types" }
braincore-graph = { path = "../braincore-graph" }
braincore-sketch = { path = "../braincore-sketch" }
pyo3 = { version = "0.23", features = ["abi3-py311", "extension-module"] }
