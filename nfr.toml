# nfr.toml — requisitos NÃO FUNCIONAIS como contrato LEGÍVEL POR MÁQUINA.
#
# A doutrina mora em docs/10-engenharia-ai-friendly.md §5–§17; este arquivo
# registra, requisito a requisito, o que o produto de fato PRENDE por teste,
# o que só MEDE e o que apenas DECLARA — e `backend/tests/test_nfr_toml.py`
# cruza cada `verified_by` com a suíte (o mesmo tratamento que
# architecture.toml [gate] e epistemics.toml recebem). Um selo ✅ que cite um
# ARQUIVO em vez de um TESTE não passa aqui.
#
# Vocabulários fechados (o teste recusa valor fora deles):
#   level   = guarantee  → vale sempre no escopo; teste prova
#           | premise    → assumido; o produto não detecta a violação
#           | target     → alvo desejado; ainda não medido no perfil declarado
#   status  = pinned     → ≥1 teste em verified_by e todos existem
#           | measured   → medido (measured_by aponta o verbo/chave)
#           | declared   → só prosa; `notes` diz o que falta
#   scope   = S0 (local, um daemon, um host — docs/10 §16)
#
# `verified_by` usa `arquivo.py::função` (ou só `arquivo.py` quando o
# arquivo inteiro é a prova). Requisito `declared` MUST ter `notes`.
schema_version = 1

[registry]
version = "1.0.0"
doctrine = "docs/10-engenharia-ai-friendly.md"

