question = "que trabalho assíncrono existe, e como cada job adapta uma facade ao contrato `run(settings, payload, emit)`?"
not_means = "lógica de domínio: o job é adapter, a lógica mora no use case"
depends_on = ["facades", "models", "okf", "retrieval", "runtime", "settings", "usecases"]

[blocks.jobs_proc]
kind = "code"
