# ---------------------------------------------------- aplicação (camada 4)
[blocks.usecases]
kind = "code"
paths = ["backend/src/corpusmith/usecases/"]
question = "qual é a operação do domínio — uma classe, um `execute()`?"
not_means = "orquestração nem transporte: use case não importa facades, api nem jobs (INV-ARCH-003, INV-ARCH-005)"
depends_on = ["cognitive", "compute", "epistemic", "harness", "ingestion", "kernel", "models", "normalize", "okf", "retrieval", "runtime", "settings"]

# ------------------------------------------------- orquestração (camada 5)
[blocks.facades]
kind = "code"
