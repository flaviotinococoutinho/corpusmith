[blocks.api]
kind = "code"
paths = ["backend/src/corpusmith/api/"]
question = "como o mundo HTTP local — cockpit e CLI de controle — fala com o produto, autenticado?"
not_means = "lugar de regra: a rota não decide domínio e não chama use case nem job direto (INV-ARCH-004)"
depends_on = ["facades", "harness", "kernel", "okf", "retrieval", "runtime", "settings"]

# `[dependency_rule].api_allowed_internal = ["facades"]` é allowlist e a
# suíte só proíbe usecases/jobs — o vão que docs/17 mediu. Cada aresta
# abaixo é onde `api` pula a facade HOJE, com o motivo conferível.
[blocks.api.debts]
harness = "api/system.py registra o exception_handler de HarnessRejection (422 com código estável) importando o tipo do Harness, não da facade"
kernel = "api/curation.py captura UndoNotExpressible (409 nomeado) e api/system.py usa kernel.identity para o id da instância do daemon"
okf = "api/cockpit.py instancia BundleWriter só pelo `.reader`, para listar e ler páginas do bundle no Dashboard e no Explorer sem passar pela MemoryFacade"
retrieval = "api/cockpit.py chama retrieval.observatory (grafo, insights, lacunas, dicionário, traces) e related_pages direto — os indicadores leem a projeção sem facade"
runtime = "api/cockpit.py e api/system.py abrem runtime.db e index.db por connect() com SQL inline (Dashboard, órfãs, saúde) e api/system.py tipa EventBus, Governor e JobQueue montados pelo daemon"
settings = "toda rota recebe Settings para instanciar as facades — configuração, não domínio, mas a allowlist `api_allowed_internal` não a prevê"

[blocks.cli]
kind = "code"
paths = ["backend/src/corpusmith/cli.py"]
question = "que operações um humano ou agente executa pela linha de comando, offline ou via daemon?"
not_means = "segunda implementação: CLI, API e painel leem a MESMA fonte"
depends_on = ["bench", "context_pack", "daemon", "facades", "harness", "jobs", "kernel", "models", "okf", "runtime", "settings", "usecases"]

[blocks.daemon]
kind = "code"
paths = ["backend/src/corpusmith/daemon.py"]
question = "como fila, worker, scheduler e API sobem num processo local com token efêmero?"
not_means = "lugar de regra: só compõe e sobe os adapters"
