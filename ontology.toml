# ontology.toml — ONTOLOGIA E ETIMOLOGIA DO CORPUSMITH (RFC-004; §4 ADR-60).
#
# Terceiro contrato legível-por-máquina do produto, ao lado de
# `architecture.toml` (o que o software PODE depender de quê) e
# `epistemics.toml` (o que um mecanismo PODE alegar). Este responde a
# pergunta que faltava: **o que cada palavra do produto SIGNIFICA, e o que
# ela não pode passar a significar**.
#
# NÃO é decorativo. `backend/tests/test_ontology.py` cruza os vocabulários
# declarados aqui com as constantes reais de `kernel/ontology.py`, e
# `corpusmith ontology lint` (mesma implementação da API e dos testes)
# verifica que cada `lives_in` existe e que cada deriva registrada em
# `[drift.*]` ainda é verdade no código. Termo que mente sobre o código
# quebra a suíte; deriva que já foi consertada e continua aberta aqui vira
# finding — o registro não pode apodrecer em nenhuma das duas direções.
#
# POR QUE ETIMOLOGIA. Não é ornamento culto: a raiz de uma palavra é o
# argumento de por que ela foi escolhida e, sobretudo, **o que ela
# proíbe**. `canon` vem de "régua de medir" — por isso canônico é o que
# mede, não o que é verdadeiro, e ADR-53 §3 pode proibir "fonte da
# verdade" sem que isso pareça modéstia arbitrária. `index` vem de "dedo
# indicador" — por isso o índice APONTA e nunca é a coisa apontada, que é
# o axioma A-1 inteiro em uma etimologia. Cada verbete abaixo carrega o
# campo `constrains`: a regra operacional que a raiz impõe.
#
# §4 (ADR-60) aplica a mesma disciplina às PARTES do repositório: cada
# bloco do projeto responde a UMA pergunta, todo arquivo versionado
# pertence a UM bloco, e a dependência entre blocos de código é declarada
# e conferida contra os imports reais — o índice semântico do projeto.
schema_version = 1

[ontology]
version = "1.2.0"  # §4 blocos do projeto + `block_kind` + `project_block` + [drift.block]

# =====================================================================
# 1. EIXOS — as perguntas independentes sobre uma afirmação
# =====================================================================
# Um eixo é uma pergunta cuja resposta não determina a resposta das
# outras. O teste de que um valor está no eixo certo é conseguir
# responder a pergunta DESTE eixo com ele, e não a de outro. Foi
# exatamente esse teste que `confidence` reprovou: `extracted` responde
# "como derivou", `ambiguous` responde "resolveu?" e `human_approved`
# responde "quem autorizou" — três perguntas, um campo.

[axes.derivation_method]
question = "COMO esta afirmação passou a existir?"
values = ["extracted", "inferred", "asserted", "imported"]
applies_to = "assertion"
etymology = "lat. derivare, 'desviar água do rio' (de + rivus) — o curso vem de outro lugar e o percurso é rastreável"
constrains = "o valor descreve o PERCURSO, nunca a qualidade do resultado nem quem o aprovou"
lives_in = ["backend/src/corpusmith/kernel/ontology.py"]

[axes.resolution_status]
question = "as leituras concorrentes foram assentadas?"
values = ["resolved", "ambiguous", "contested"]
applies_to = "assertion"
etymology = "lat. resolvere, 'desatar' (re + solvere) — desfazer o nó, não cortá-lo"
constrains = "só um ato posterior desata; nenhuma fusão, recompilação ou reindexação pode assentar sozinha o que ninguém assentou"
lives_in = ["backend/src/corpusmith/kernel/ontology.py"]

[axes.governance_status]
question = "quem autorizou isto a contar como conhecimento?"
values = ["proposed", "ratified", "retired"]
applies_to = "assertion"
etymology = "lat. gubernare ← gr. kybernân, 'pilotar' — quem governa conduz e responde pelo rumo, não possui o navio"
constrains = "ratificação é ATO datado e atribuído; ausência de ato é `proposed`, jamais silêncio a favor"
lives_in = ["backend/src/corpusmith/kernel/ontology.py"]

# O quarto eixo JÁ EXISTE, fechado e validado — mas aplicado a mecanismo,
# não a afirmação. Declará-lo de novo aqui criaria a segunda definição do
# mesmo termo, que é o defeito que este arquivo combate. Fica registrado
# com a fonte real e com o vão explícito.
[axes.evaluation_status]
question = "o quanto isto foi medido, e em que regime?"
values = ["unevaluated", "partially_evaluated", "evaluated", "drifted", "invalidated"]
applies_to = "mechanism"
etymology = "lat. ex + valere, 'extrair o valor' — medir é extrair, e o que não foi medido não tem valor extraído"
constrains = "hoje cobre MECANISMO; nenhuma afirmação do bundle carrega este eixo, e RFC-004 §6 é onde isso muda"
lives_in = ["backend/src/corpusmith/epistemic/model.py"]

# =====================================================================
# 2. TERMOS — o vocabulário do produto, com o que a raiz proíbe
# =====================================================================

[terms.corpus]
roots = "lat. corpus, 'corpo'"
means = "o conjunto trabalhado como UM: tem partes, fronteira e integridade verificável"
not_means = "uma pilha de arquivos, um bucket, um diretório"
constrains = "operação que não preserva a integridade do todo não é operação de corpus — por isso toda escrita passa por um gate só"
lives_in = ["backend/src/corpusmith/okf/bundle.py"]

[terms.smith]
roots = "ing. ant. smiþ ← proto-germ. *smiþaz, 'artesão, o que trabalha o metal'"
means = "ofício sobre material que já existe: forjar é dar forma, não criar matéria"
not_means = "gerar conteúdo, sintetizar do nada"
constrains = "o produto não inventa conhecimento; ele compila fontes — e quando não há fonte suficiente, abstém"
lives_in = ["backend/src/corpusmith/kernel/sufficiency.py"]

[terms.capta]
roots = "lat. capta, particípio de capere, 'tomar' — em oposição a data, particípio de dare, 'dar'"
means = "o que foi APREENDIDO e afirmado por um agente cognitivo: atribuição, datação, classificação, interpretação"
not_means = "dado objetivo, medida independente de observador"
constrains = "para capta, quem afirmou e sob que autoridade é constitutivo, não metadado — e por isso um corpus de capta que se anuncie 'fonte da verdade' está errado sobre o próprio material, não apenas exagerando (Drucker 2011; Vitali & Pasqual 2026 — docs/26)"
lives_in = ["docs/26-pesquisa-da-camada-epistemica.md"]

[terms.canon]
roots = "gr. kanṓn, 'régua, vara de medir' (de kánna, 'cana')"
means = "aquilo com que se mede o resto: o bundle é a régua contra a qual toda projeção é conferida"
not_means = "aquilo que é verdadeiro"
constrains = "canônico ≠ verdadeiro — o registro diz o que foi ACEITO e por quem; é esta raiz que sustenta a proibição de 'fonte da verdade' em ADR-53 §3"
lives_in = ["backend/src/corpusmith/kernel/checkpoints.py"]

[terms.index]
roots = "lat. index, 'o dedo indicador; aquele que aponta'"
means = "a projeção consultável que APONTA para o canônico"
not_means = "o conteúdo apontado"
constrains = "índice não decide sobre o canônico; apagá-lo não perde conhecimento (INV-001/002, e o defeito que RFC-002 corrigiu foi exatamente uma projeção decidindo)"
lives_in = ["backend/src/corpusmith/retrieval/fts.py"]

[terms.evidence]
roots = "lat. evidentia, de videre, 'ver' — 'aquilo que se dá a ver'"
means = "o trecho exato que se pode olhar: página, span, offset"
not_means = "a alegação de que existe suporte"
constrains = "evidência que não pode ser EXIBIDA não conta como evidência — daí spans com offset, e não apenas nome de página"
lives_in = ["backend/src/corpusmith/kernel/sufficiency.py", "backend/src/corpusmith/okf/regions.py"]

[terms.provenance]
roots = "lat. provenire, 'vir de' (pro + venire)"
means = "o caminho percorrido desde a fonte, região a região"
not_means = "um rótulo de origem colado na página inteira"
constrains = "proveniência é por REGIÃO, não por elemento nem por documento — uma página com duas fontes tem duas proveniências"
lives_in = ["backend/src/corpusmith/okf/regions.py", "backend/src/corpusmith/okf/absorbed.py"]

[terms.authority]
roots = "lat. auctoritas, de auctor ← augere, 'fazer crescer, originar'"
means = "quem pode fazer o corpus crescer, e responde por isso"
not_means = "quem tem razão"
constrains = "autoridade é sobre PERMISSÃO de escrita e origem, nunca sobre acerto; o termo carrega cinco sentidos no código e [drift.authority] registra quais"
lives_in = ["backend/src/corpusmith/okf/authorities.py"]

[terms.curation]
roots = "lat. curare ← cura, 'cuidado, zelo'"
means = "responder pelo estado do corpus ao longo do tempo"
not_means = "controlar, aprovar, filtrar"
constrains = "todo ato de curadoria tem preview antes do efeito e é reversível — cuidado sem possibilidade de desfazer é controle"
lives_in = ["backend/src/corpusmith/usecases/curate/base.py"]

[terms.assertion]
roots = "lat. asserere, ad + serere, 'atar a si' (mesma raiz de 'série')"
means = "uma afirmação atada a quem a sustenta e à evidência que a prende"
not_means = "uma frase, um chunk, um fato solto"
constrains = "quem afirma fica atado: nenhuma asserção existe sem sustentação identificável — e é por isto que a página, que pode conter duas asserções de fontes diferentes, não serve como unidade epistêmica (RFC-004 §2)"
lives_in = ["docs/22-rfc-ontologia-da-assercao.md"]

[terms.ratification]
roots = "lat. ratus, 'calculado, fixado' + facere, 'fazer' — 'tornar fixo'"
means = "o ato datado que fixa uma proposta como aceita"
not_means = "concordar, achar bom, não contestar"
constrains = "ratificação é evento com autor e data em `curation_acts`; ela cobre um CONTEÚDO, e conteúdo alterado perde a cobertura (kernel/ontology.py:merge_confidence)"
lives_in = ["backend/src/corpusmith/kernel/ontology.py", "backend/src/corpusmith/usecases/curate/base.py"]

[terms.verdict]
roots = "lat. vere dictum, 'dito com verdade'"
means = "o juízo humano sobre um objeto computado, com prazo declarado"
not_means = "o resultado do cálculo"
constrains = "veredito suprime COM MOTIVO e com `until`; jamais apaga o objeto computado"
lives_in = ["backend/src/corpusmith/kernel/verdicts.py"]

[terms.stale]
roots = "fr. ant. estale, 'parado, estagnado' (dito de líquido), de origem germânica"
means = "parado desde uma referência de código — pode precisar de revisão"
not_means = "falso, inválido, vencido no mundo"
constrains = "`stale_as_of` é tempo de CÓDIGO e não toca `invalid_at`, que é tempo de MUNDO; confundi-los depreca fato que continua valendo"
lives_in = ["backend/src/corpusmith/usecases/mark_stale.py"]

[terms.harness]
roots = "ant. fr. herneis, 'arreio, equipamento'"
means = "o que prende e habilita ao mesmo tempo: o caminho único de escrita"
not_means = "um validador opcional"
constrains = "não há escrita fora do arreio; regra de conformidade OKF e regra de política local ficam em camadas SEPARADAS, para que o produto nunca invente exigência do SPEC"
lives_in = ["backend/src/corpusmith/harness/local_policy.py"]

[terms.vitality]
roots = "lat. vita, 'vida'"
means = "estar vivo = aceitar trabalho novo"
not_means = "existir, estar presente, ser recuperável"
constrains = "aposentar não apaga: a página sucedida continua no bundle, no Git e no índice, e só deixa de ser endereço de trabalho"
lives_in = ["backend/src/corpusmith/kernel/vitality.py"]

[terms.epistemic]
roots = "gr. epistḗmē, 'conhecimento', em oposição a dóxa, 'opinião'"
means = "a fronteira entre o que se sabe e o que se acha, marcada explicitamente"
not_means = "certeza, rigor, formalidade"
constrains = "toda garantia é RELATIVA a um regime declarado; `universal_guarantee = true` é proibido pelo lint"
lives_in = ["epistemics.toml", "backend/src/corpusmith/epistemic/validate.py"]

[terms.compile]
roots = "lat. compilare, 'juntar em monte'"
means = "montar um artefato a partir de fontes, sob regras, de forma repetível"
not_means = "resumir, reescrever, gerar"
constrains = "a mesma fonte sob as mesmas regras produz o mesmo artefato — determinismo antes de modelo, com o LLM como estágio cercado"
lives_in = ["backend/src/corpusmith/usecases/base.py"]

[terms.ontology]
roots = "gr. ón, óntos, 'aquilo que é' + -logía, 'discurso sobre'"
means = "o discurso sobre O QUE EXISTE no sistema: quais entidades há e quais eixos as descrevem"
not_means = "uma ontologia formal com semântica lógica"
constrains = "declarar que algo existe não é alegar que é verdadeiro; ADR-53 §3 proíbe 'ontologia formal' e este arquivo não a introduz"
lives_in = ["ontology.toml", "backend/src/corpusmith/kernel/ontology.py"]

[terms.stability]
roots = "lat. stabilis, 'que se pode manter de pé' (de stare, 'estar em pé') — firmeza de POSTURA, não de mérito"
means = "quietude no eixo de EDIÇÃO: quantas vezes a página mudou e quando parou de mudar (RFC-006 V3, kernel/stability.py)"
not_means = "correta, revisada, aprovada nem importante"
constrains = "a palavra carrega QUATRO sentidos no produto (edição, ciclo de vida, uso, tema) e cada um tem dono próprio — usar 'estável' sem dizer em qual eixo é a conflação que docs/30 fixou"
lives_in = ["backend/src/corpusmith/kernel/stability.py", "docs/30-dicionario-da-re-mira.md"]

[terms.difficulty]
roots = "lat. difficultas (dis- + facilis, 'não fácil') — a NEGAÇÃO de fácil, não a afirmação de valor"
means = "índice composto de onde o estudo trava: falha de recuperação com sobreconfiança, conflito, pergunta aberta, vocabulário ambíguo e lacuna reincidente (RFC-006 V4)"
not_means = "importância, prioridade, qualidade — nem 'ninguém achou útil', que é `low_yield` e tem outro dono"
constrains = "score 0 com `medida=false` é NADA OBSERVADO, jamais 'fácil de explicar'; a etimologia pela negação é o próprio limite — o índice sabe negar facilidade, não afirmar dificuldade absoluta"
lives_in = ["backend/src/corpusmith/kernel/difficulty.py"]

[terms.application]
roots = "lat. applicare, 'dobrar em direção a' (ad + plicare) — algo se DOBRA na direção do caso; o caso não é gerado pelo conceito"
means = "relação declarada por ato humano entre um conceito e o caso onde ele vale (RFC-006 V5, `applies_to`/`exemplifies`)"
not_means = "menção, semelhança ou co-ocorrência; tampouco prova de que o conceito funciona ali"
constrains = "a aresta liga PÁGINAS, então afirma a página inteira do destino — enquanto o nível da afirmação (docs/28) não existir, essa grossura é declarada e MEDIDA (`ambiguous_fraction`), nunca dissimulada"
lives_in = ["backend/src/corpusmith/kernel/semantics.py", "backend/src/corpusmith/usecases/practical_cases.py"]

[terms.side_effect]
roots = "efeito COLATERAL: lat. cum + latus, 'do mesmo lado' — o que acontece ao lado do que se pediu, sem ter sido pedido"
means = "o que um mecanismo ESCREVE além de responder: canônico (bundle+Git), projeção recomputável ou dado de uso (C6)"
not_means = "erro nem bug: um efeito colateral declarado é legítimo — o que é ilegítimo é ele existir sem estar dito"
constrains = "escrita no CANÔNICO obriga `high_impact`; um `/ask` que move o HEAD do Git é exatamente o caso que criou este verbete, e ele agora não pode existir sem estar declarado"
lives_in = ["backend/src/corpusmith/epistemic/model.py"]

[terms.project_block]
roots = "bloco: fr. bloc ← neerl. médio blok, 'tronco cortado, peça maciça' — o que tem FRONTEIRA e se move inteiro"
means = "uma parte do repositório — um conjunto de caminhos — que responde a UMA pergunta, com o que ela NÃO é declarado ao lado (ontology.toml §4)"
not_means = "uma pasta qualquer, um arquivo solto, um pacote só porque existe; nem o bloco do corpo, do grafo, de sucessão ou de estudo, que são outros sentidos ([drift.block])"
constrains = "o tronco cortado tem fronteira: todo arquivo versionado pertence a UM bloco, a dependência entre blocos de código é declarada, e a aresta que contraria o gradiente só existe como dívida com motivo — o qualificador 'do projeto' é obrigatório porque 'bloco' sozinho já responde a quatro perguntas"
lives_in = ["backend/src/corpusmith/kernel/blocks.py", "backend/src/corpusmith/harness/ontology.py"]

# =====================================================================
# 2b. VOCABULÁRIOS FECHADOS DE OUTROS OBJETOS
# =====================================================================
# Eixo (§1) é pergunta sobre uma AFIRMAÇÃO. Aqui ficam os vocabulários
# fechados sobre objetos DIFERENTES — a relação entre duas páginas e o
# efeito de um mecanismo. A separação não é organizacional: pôr tudo em
# `axes` faria `eixos_de()` responder sobre dois objetos com a mesma
# cara, que é o erro de nível que a RFC-004 combate no conteúdo.
#
# `kernel/ontology.py:VOCABULARIES` espelha estes valores e o
# `ontology lint` cobra o verbete: vocabulário fechado novo sem entrada
# aqui é ERRO. Foi assim que o buraco apareceu — a V5 e a C6 criaram
# vocabulário e o léxico não cresceu, em silêncio.

[vocabularies.semantic_relation]
question = "que tipo de relação um humano DECLAROU entre duas páginas?"
values = ["applies_to", "exemplifies", "refines"]
applies_to = "relation"
etymology = "lat. relatio, 'ação de levar de volta' (referre) — a relação LEVA de uma coisa à outra e guarda a direção do trajeto"
constrains = "estrito na ESCRITA (o ato recusa valor fora daqui, porque o canônico é para sempre) e tolerante na LEITURA (desconhecido vira não-tipado, nunca derruba um rebuild); a direção é parte do sentido — `applies_to` invertido afirma o contrário"
lives_in = ["backend/src/corpusmith/kernel/semantics.py"]

[vocabularies.side_effect]
question = "o que este mecanismo ESCREVE, além de responder?"
values = ["none", "canonical_write", "projection_write", "state_write"]
applies_to = "mechanism"
etymology = "lat. effectus, 'o que foi levado a cabo' (ex + facere) + colateral, 'do mesmo lado' — o que se realiza ao lado do que se pediu"
constrains = "os três destinos não são graus do mesmo eixo: canônico é AUTORIDADE (e obriga `high_impact`), projeção é recomputável, estado é uso — e `none` ao lado de outro valor é contradição, não ênfase"
lives_in = ["backend/src/corpusmith/epistemic/model.py"]

[vocabularies.block_kind]
question = "que TIPO de artefato este bloco do projeto agrupa — e portanto que verificação o protege?"
values = ["code", "test", "registry", "doc", "build"]
applies_to = "project_block"
etymology = "ing. ant. cynd, 'natureza, linhagem' (a raiz de kin) — o tipo diz de que NATUREZA é o artefato, não onde ele mora nem quanto importa"
constrains = "cada tipo tem a SUA verificação — código: arquitetura e suíte; teste: execução; registro: lint cruzado com o código; doc: contrato de documentação; build: o gate que o executa. Um bloco que precisasse de duas verificações está grande demais, e tipo novo é decisão (ADR), não digitação"
lives_in = ["backend/src/corpusmith/kernel/blocks.py"]

# =====================================================================
# 3. DERIVA SEMÂNTICA — onde uma palavra ainda responde a duas perguntas
# =====================================================================
# Registro VIVO, não confissão decorativa. Cada `marker` é uma string que,
# existindo no arquivo apontado, prova que AQUELE SENTIDO está no código.
# O que muda com o `status` é o que a ausência significa:
#   marker some + status "open"     -> ontology.drift_sense_gone (warn):
#       o sentido saiu do código; se a deriva foi paga, pare de cobrá-la;
#   marker some + status "resolved" -> ontology.drift_regressed (error):
#       a separação perdeu um de seus nomes distintos — regressão.
# Assim a deriva não apodrece aqui nem volta ao código em silêncio. Foi
# assim que `confidence` passou de "todo mundo sabe" a defeito com
# correção datada.

[drift.confidence]
field = "confidence"
status = "open"
senses = [
  "derivação da aresta/página: extracted|inferred (compute/python_kernel.py)",
  "resolução da leitura: ambiguous (usecases/reconcile_candidate.py)",
  "governança: human_approved (usecases/promote_memory.py)",
  "autorrelato preditivo em [0,1]: confidence_before (usecases/cognitive_journey.py)",
  "taxa estatística e lacuna de calibração: rate, hi_rate - lo_rate, gap (usecases/metacognition.py)",
  "intervalo de avaliação: confidence_intervals (epistemic/model.py)",
]
markers = [
  ["backend/src/corpusmith/compute/python_kernel.py", "EDGE_WEIGHT = {\"extracted\": 1.0"],
  ["backend/src/corpusmith/usecases/promote_memory.py", "\"confidence\": \"human_approved\""],
  ["backend/src/corpusmith/usecases/cognitive_journey.py", "confidence_before"],
  ["backend/src/corpusmith/usecases/metacognition.py", "\"confidence\": rate"],
  ["backend/src/corpusmith/epistemic/model.py", "confidence_intervals"],
]
paid = "kernel/ontology.py separa os três eixos do frontmatter e corrige merge_meta; os sentidos numéricos (autorrelato, taxa, intervalo) seguem no mesmo nome e são RFC-004 §6"

[drift.authority]
field = "authority / autoridade"
status = "open"
senses = [
  "autoridade de NOME: o gazetteer curado decide a grafia canônica (okf/authorities.py)",
  "autoridade de ARMAZENAMENTO: o bundle + Git manda sobre as projeções (kernel/checkpoints.py)",
  "autoridade de DECISÃO: quem pode ratificar e reverter (usecases/curate/base.py)",
  "autoridade de REFERÊNCIA: baseline medido que arbitra regressão (bench.py)",
  "tipo de página protegida contra congelamento: authority_record (usecases/cold_memory.py)",
]
markers = [
  ["backend/src/corpusmith/okf/authorities.py", "\"authority\": r[\"kind\"]"],
  ["backend/src/corpusmith/kernel/checkpoints.py", "\"bundle\": None"],
  ["backend/src/corpusmith/bench.py", "a autoridade DECLARADA de performance"],
  ["backend/src/corpusmith/usecases/cold_memory.py", "PROTECTED_TYPES = {\"authority_record\""],
]
paid = "nenhum ainda — os cinco sentidos convivem. A RFC-006 V2 CONTORNOU a deriva em vez de pagá-la, e a distinção importa: o sentido do conceito passou a morar no CANÔNICO (`Entropia (física)`) justamente para não ser enfiado no campo `authority`, que já responde a cinco perguntas. Medido na V2: nenhum schema mudou e nenhum sentido foi separado — a deriva segue aberta, agora com a evidência de que ampliá-la seria o caminho errado. docs/23 §3 nomeia cada sentido; RFC-004 §6 propõe os qualificadores"

[drift.evidence]
field = "evidence"
status = "open"
senses = [
  "de QUALIDADE do mecanismo: como ele foi validado (epistemics.toml, vocabulário fechado)",
  "de SUPORTE da resposta: os trechos que sustentam o que foi respondido (usecases/ask_memory.py)",
  "de OBSERVAÇÃO: os registros por trás de uma proposta metacognitiva (usecases/metacognition.py)",
]
markers = [
  ["epistemics.toml", "evidence = "],
  ["backend/src/corpusmith/usecases/ask_memory.py", "evidence_support"],
  ["backend/src/corpusmith/usecases/metacognition.py", "json.dumps(prop[\"evidence\"])"],
]
paid = "nenhum — os três sentidos são legítimos e distintos; falta o qualificador no nome"

# Medida ao criar §4 (ADR-60): a palavra que o pedido usou — "blocos do
# projeto" — já respondia a cinco perguntas no código. O sexto sentido
# nasceu QUALIFICADO (`project_block`) para não engrossar a deriva; os
# outros seguem sem qualificador, e cada marcador prova que o sentido vive.
[drift.block]
field = "bloco"
status = "open"
senses = [
  "bloco SENTINELADO do corpo: região canônica delimitada por sentinelas (okf/relations.py, okf/absorbed.py)",
  "bloco do GRAFO: comunidade/componente ligada por arestas (kernel/topology.py, kernel/semantics.py)",
  "bloco de SUCESSÃO: páginas ligadas por supersede, resolvidas entre si (harness/local_policy.py)",
  "bloco de ESTUDO: unidade de trabalho que cabe na carga cognitiva (usecases/plan_attention.py)",
  "bloco de RESPOSTA: seção de um payload ou painel (api/system.py)",
  "bloco do PROJETO: parte do repositório com pergunta e fronteira (kernel/blocks.py, §4 deste arquivo)",
]
markers = [
  ["backend/src/corpusmith/okf/absorbed.py", "_NOME = \"bloco de absorção\""],
  ["backend/src/corpusmith/kernel/topology.py", "dois blocos (comunidades)"],
  ["backend/src/corpusmith/harness/local_policy.py", "blocos: dict[str, set[str]] = {}"],
  ["backend/src/corpusmith/usecases/plan_attention.py", "só blocos pequenos"],
  ["backend/src/corpusmith/api/system.py", "um bloco por banco"],
  ["backend/src/corpusmith/kernel/blocks.py", "KINDS: tuple[str, ...] = (\"code\""],
]
paid = "só o sentido novo: ele nasceu como `project_block` (termo, vocabulário `block_kind` e §4), com o qualificador obrigatório no verbete. Os cinco anteriores seguem convivendo no mesmo nome — o mais carregado é o do corpo (região canônica), e o próximo passo é o qualificador 'região' nos textos de okf/relations.py e okf/absorbed.py"

# Entrada RESOLVIDA: fica registrada para que a separação não regrida. Os
# quatro tempos já têm nomes distintos, e o lint acusa se algum sumir.
[drift.time]
field = "tempo"
status = "resolved"
senses = [
  "tempo de MUNDO — quando o fato passou a valer: valid_at / invalid_at",
  "tempo de REGISTRO — quando escrevemos: timestamp",
  "tempo de CÓDIGO — desde que commit isto pode estar parado: stale_as_of",
  "tempo de GOVERNANÇA — quando o curador fechou: resolved_at",
]
markers = [
  ["backend/src/corpusmith/okf/document.py", "valid_at: datetime | None = None"],
  ["backend/src/corpusmith/okf/document.py", "resolved_at: datetime | None = None"],
  ["backend/src/corpusmith/usecases/mark_stale.py", "meta[\"stale_as_of\"] = head"],
]
paid = "v0.8 §6.3 (bi-temporalidade) e F3-PR2 (resolved_at) — a entrada existe para impedir regressão, não para cobrar dívida"

# =====================================================================
# 4. BLOCOS DO PROJETO — o que existe no repositório, e a pergunta que
#    cada parte responde (ADR-60, INV-ONT-002)
# =====================================================================
# O índice SEMÂNTICO do repositório. Cada bloco declara só o que nenhuma
# outra fonte sabe: os caminhos que cobre (`/` final = diretório), a
# PERGUNTA que responde, o que ele NÃO é e — para código Python — de que
# blocos depende. Todo o resto é DERIVADO pelo lint e pelo índice
# (`corpusmith ontology blocks|where`): a camada vem de `architecture.toml
# [[tier]]`, os termos dos `lives_in` acima, os mecanismos dos
# `implementation_refs` de `epistemics.toml`, os testes do AST de
# `backend/tests`. Nada aqui é cópia.
#
# As regras que o `ontology lint` impõe, e por quê:
# - PARTIÇÃO: todo arquivo versionado pertence a exatamente UM bloco — a
#   mesma propriedade que define um eixo (nenhum termo em dois eixos),
#   transposta para arquivos. Arquivo novo fora do índice é erro;
# - UNIDADE: bloco de código Python é exatamente UMA unidade do gradiente
#   e tem o nome dela, para que `depends_on` leia como os imports;
# - DEPENDÊNCIA: `depends_on` é allowlist conferida contra os imports
#   reais (de topo E tardios) nas duas direções — acoplamento novo entre
#   blocos aparece no diff deste arquivo, nunca só num `import`;
# - DÍVIDA: a aresta que aponta para FORA do gradiente, ou que `api` faz
#   além da allowlist de `[dependency_rule]`, só existe em `debts`, com
#   motivo; dívida paga e não descadastrada vira aviso. O que
#   `[dependency_rule]` PROÍBE não vira dívida: é erro.

# ------------------------------------------------- núcleo puro (camada 0)
[blocks.kernel]
kind = "code"
paths = ["backend/src/corpusmith/kernel/"]
question = "que regra do domínio vale sem I/O, rede, disco ou transporte?"
not_means = "lugar de efeito: quem precisa de efeito recebe o resultado e o aplica na casca (functional core, imperative shell — INV-ARCH-001)"
depends_on = []

[blocks.normalize]
kind = "code"
paths = ["backend/src/corpusmith/normalize/"]
question = "como texto livre vira menções tipadas e normalizadas (identificadores, datas, quantidades, normas, lugares)?"
not_means = "validação de fato: reconhecer a forma de um identificador não diz que o que ele afirma é verdadeiro"
depends_on = []

[blocks.cognitive]
kind = "code"
paths = ["backend/src/corpusmith/cognitive/"]
question = "o que a pessoa quer explorar agora, em que profundidade e com que esforço?"
not_means = "memória canônica: o plano cognitivo LÊ a memória e nunca altera confiança ou validade nela (INV-ARCH-002, INV-DATA-004)"
depends_on = []

[blocks.epistemic]
kind = "code"
paths = ["backend/src/corpusmith/epistemic/"]
question = "o que cada mecanismo heurístico pode alegar — sob que vieses, com que garantia relativa e com que efeito colateral?"
not_means = "certificação: o contrato declara limites, não prova acerto, e nenhum mecanismo se autoavalia (INV-EPI-001)"
depends_on = []

# --------------------------------------------------- plataforma (camada 1)
[blocks.paths]
kind = "code"
paths = ["backend/src/corpusmith/paths.py"]
question = "onde um recurso empacotado mora, dentro e fora do binário PyInstaller?"
not_means = "configuração nem política: só resolve caminho, explícito, em vez de contar `parents[]`"
depends_on = []

[blocks.settings]
kind = "code"
paths = ["backend/src/corpusmith/settings.py"]
question = "que configuração está vigente, e com que precedência (override, ambiente, default empacotado, código)?"
not_means = "decisão de domínio — e o default de privacidade `local_only` não muda sem RFC (AGENTS §5)"
depends_on = ["paths"]

[blocks.runtime]
kind = "code"
paths = ["backend/src/corpusmith/runtime/"]
question = "como o daemon persiste estado operacional, enfileira, agenda e despacha trabalho e publica eventos?"
not_means = "conhecimento: `runtime.db` é autoridade OPERACIONAL (jobs, telemetria, vereditos), nunca sobre o bundle"
depends_on = ["jobs", "kernel", "okf", "paths", "settings"]

[blocks.runtime.debts]
jobs = "runtime/worker.py importa o REGISTRY de jobs dentro de função, para fugir do ciclo de import, e despacha por ele; injetar o registry a partir do daemon e do jobs_proc paga a dívida"
okf = "runtime/checkpoints.py lê o HEAD do bundle por okf.authorities._kb_head num import tardio; o HEAD devia chegar por parâmetro de quem já conhece o bundle"

# --------------------------------------------- domínio canônico (camada 2)
[blocks.okf]
kind = "code"
paths = ["backend/src/corpusmith/okf/"]
question = "como o conhecimento canônico é representado, escrito por um caminho único e versionado no bundle (OKF + Git)?"
not_means = "projeção consultável: o bundle é a régua, e índice e bancos só apontam para ele (axioma A-1)"
depends_on = ["harness", "normalize", "runtime"]

[blocks.harness]
kind = "code"
paths = ["backend/src/corpusmith/harness/"]
question = "o que pode entrar no canônico, e o que os registros epistêmico e ontológico permitem alegar?"
not_means = "validador opcional: não há escrita fora do arreio (INV-DATA-001), e conformidade OKF e política local ficam em camadas separadas"
depends_on = ["epistemic", "kernel", "normalize", "okf", "paths"]

[blocks.retrieval]
kind = "code"
paths = ["backend/src/corpusmith/retrieval/"]
question = "como o índice reconstruível (FTS, denso, grafo, descida) responde consultas e alimenta os indicadores?"
not_means = "autoridade: apagar `index.db` não perde conhecimento (INV-DATA-003)"
depends_on = ["harness", "kernel", "normalize", "okf", "runtime", "settings"]

[blocks.compute]
kind = "code"
paths = ["backend/src/corpusmith/compute/"]
question = "por qual backend — Python de referência ou Rust — os sinais e projeções CPU-bound são calculados?"
not_means = "decisão de domínio: Rust calcula sinais, Python decide o significado (ADR-39)"
depends_on = ["kernel", "runtime"]

[blocks.native]
kind = "code"
paths = ["native/crates/"]
question = "como os kernels CPU-bound (grafo, sketch, texto, ETL) rodam em Rust, como extensão PyO3 e como worker?"
not_means = "segunda implementação de regra: a equivalência com o Python é provada por teste diferencial, e o compute plane nunca decide domínio"

# ---------------------------------------------- borda acionada (camada 3)
[blocks.models]
kind = "code"
paths = ["backend/src/corpusmith/models/"]
question = "qual modelo de linguagem atende uma chamada (escada local → API), sob orçamento e política de privacidade?"
not_means = "autoridade de escrita, validação ou reconciliação: o LLM é estágio cercado na borda (AGENTS §5)"
