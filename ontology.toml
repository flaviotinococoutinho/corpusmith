question = "qual é o schema de cada banco SQLite, e como ele evolui sem perder dado?"
not_means = "autoridade sobre o conhecimento — nem migração destrutiva: o schema cresce de forma aditiva, com versão em `SCHEMA_VERSIONS` e trilha em `schema_migrations`"

